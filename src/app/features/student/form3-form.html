<div class="card mb-3">
  <div class="card-header">Organization Overview & Scope of Work (Appendix C)</div>
  <div class="card-body">
    <form (ngSubmit)="submit()" #f="ngForm" class="row g-3">
      <div class="col-12">
        <label class="form-label"><strong>1. Organization Overview *</strong></label>
        <textarea class="form-control" rows="4" [(ngModel)]="model.organizationOverview" name="orgOverview" placeholder="Provide an overview of the organization" required></textarea>
      </div>
      
      <div class="col-12">
        <label class="form-label"><strong>2. Role Description</strong></label>
        <textarea class="form-control" rows="4" [(ngModel)]="model.roleDescription" name="roleDescription" placeholder="Describe your role and responsibilities in detail"></textarea>
      </div>
      
      <div class="col-12">
        <label class="form-label"><strong>3. Key Activities</strong> (check all that apply)</label>
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check"><input class="form-check-input" type="checkbox" [(ngModel)]="model.keyActivities.coding" name="act_coding" /><label class="form-check-label">Coding</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" [(ngModel)]="model.keyActivities.testing" name="act_testing" /><label class="form-check-label">Testing</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" [(ngModel)]="model.keyActivities.documentation" name="act_documentation" /><label class="form-check-label">Documentation</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" [(ngModel)]="model.keyActivities.dataAnalysis" name="act_data" /><label class="form-check-label">Data Analysis</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" [(ngModel)]="model.keyActivities.research" name="act_research" /><label class="form-check-label">Research</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" [(ngModel)]="model.keyActivities.technicalSupport" name="act_support" /><label class="form-check-label">Technical Support</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" [(ngModel)]="model.keyActivities.dashboard" name="act_dashboard" /><label class="form-check-label">Dashboard/Report Creation</label></div>
          <div class="form-check d-flex align-items-center">
            <input class="form-check-input" type="checkbox" [(ngModel)]="model.keyActivities.other" name="act_other" />
            <label class="form-check-label me-2">Other (please specify)</label>
            <input class="form-control form-control-sm" style="max-width:320px" [(ngModel)]="model.keyActivities.otherText" name="act_other_text" placeholder="Specify other activity" />
          </div>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label"><strong>4. Tools/Technologies</strong></label>
        <textarea class="form-control" rows="3" [(ngModel)]="model.toolsTechnologies" name="toolsTechnologies" placeholder="List all tools, technologies, frameworks, and platforms you will use (e.g., Python, React, Docker, AWS, etc.)"></textarea>
      </div>

      <div class="col-12">
        <label class="form-label"><strong>5. Expected Deliverables</strong></label>
        <textarea class="form-control" rows="3" [(ngModel)]="model.expectedDeliverables" name="expected" placeholder="Describe the expected outcomes and deliverables of your internship"></textarea>
      </div>

      <div class="col-12 d-flex gap-2 mt-3">
        <button class="btn btn-success" [disabled]="!f.form.valid || loading()" type="submit">
          <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          <span *ngIf="loading()">Submitting...</span>
          <span *ngIf="!loading()">Submit</span>
        </button>
      </div>
    </form>
  </div>
</div>
